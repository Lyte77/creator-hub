{% extends "base.html" %}

{% block app %}
<div x-data="{ sidebarOpen: false }" class="flex h-screen">

  <!-- Sidebar -->
  {% include "partials/sidebar.html" %}

  <!-- Main -->
  <div class="flex-1 flex flex-col">
    <header class="h-14 border-b border-white/10"></header>

    <!-- HTMX TARGET -->
    <main id="page-content"
     hx-get="{% url 'idea_page' %}"
        hx-trigger="load"
        hx-swap="innerHTML"
     class="flex-1 overflow-y-auto p-6">
      {% block page %}
       
      {% endblock %}
    </main>
  </div>

</div>
{% endblock %}
