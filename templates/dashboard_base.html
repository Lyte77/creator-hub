{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark" x-data="{ sidebarOpen: false }">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Creators Toolkit{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <link href="{% static 'src/output.css' %}" rel="stylesheet" />
</head>

<body class="font-sans bg-white dark:bg-[#0d0d0d] text-gray-900 dark:text-gray-100">

<div class="relative flex min-h-screen">

  {% include "partials/sidebar.html" %}

  <!-- App Shell -->
  <div class="flex flex-col flex-1 lg:ml-64">

    {% include "partials/top_navbar.html" %}

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="mx-auto max-w-7xl">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>
</div>

</body>
</html>
