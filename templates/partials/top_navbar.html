<header class="flex flex-col sm:flex-row items-start sm:items-center justify-between sticky top-0 z-20 border-b border-gray-200 dark:border-[#333] px-4 sm:px-8 py-3 bg-white dark:bg-[#1a1a1a]/90 backdrop-blur-sm">
      <div class="flex items-center justify-between w-full sm:w-auto">
        <!-- Hamburger -->
        <button class="lg:hidden flex items-center justify-center h-10 w-10 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition"
                @click="sidebarOpen = !sidebarOpen">
          <span class="material-symbols-outlined text-gray-900 dark:text-gray-200">menu</span>
        </button>
        <h2 class="text-lg font-bold ml-2 sm:ml-0">Dashboard</h2>
      </div>

      <!-- Search & Actions -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2 w-full sm:w-auto mt-2 sm:mt-0">
        <div class="flex-1 max-w-md w-full sm:w-auto">
          <div class="flex items-center rounded-lg border border-gray-200 dark:border-[#333] bg-gray-50 dark:bg-[#1a1a1a] h-10">
            <span class="material-symbols-outlined px-3 text-gray-500 dark:text-gray-400">search</span>
            <input class="flex-1 bg-transparent outline-none text-sm text-gray-900 dark:text-gray-200 placeholder-gray-500 dark:placeholder-gray-400"
                   placeholder="Search..." type="text"/>
          </div>
        </div>
        <div class="flex items-center gap-2 mt-2 sm:mt-0">
          <button class="h-10 px-4 bg-[#ff00ff] text-white font-bold rounded-lg hover:opacity-90 transition">+ New Post</button>
          <button class="h-10 px-3 flex items-center gap-2 border border-gray-200 dark:border-[#333] rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">
            <span class="material-symbols-outlined">notifications</span>
          </button>
        </div>
      </div>
    </header>
