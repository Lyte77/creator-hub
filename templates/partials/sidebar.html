<!-- Mobile Overlay Sidebar -->


 <div class="flex h-screen bg-white dark:bg-[#1a1a1a]">
<div 
  x-show="sidebarOpen" 
  class="fixed inset-0 z-30 bg-black/50 lg:hidden" 
  @click="sidebarOpen = false"
></div>

<!-- Sidebar -->

         class="fixed lg:relative z-40 w-64 bg-white dark:bg-[#1a1a1a] border-r border-gray-200 dark:border-[#333] flex flex-col p-4 h-full transform transition-transform duration-300 ease-in-out lg:translate-x-0">
    
    <!-- Logo -->
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-full bg-cover bg-center"
           style="background-image:url('https://lh3.googleusercontent.com/aida-public/AB6AXuAybwidc3wGQlTeuqGvqZlycEwNh6TnTGEMCY4o3U6PHBoE4eKVsr_NJffts9DFcDzL4PZC_mBcGSdgPiy6icltYI7i6huG5xOWxMU-js4eu7f66-s7nc5tZIQT_AXmRKdDLoFZJcicLdGH5BSWN3CbSVNOSSJniuHazYyRKPDWNSpqHqKTjGhhGZ1MxKrKaDxF-MN1DAKNe-G_QLDSWjLn2BNBUCoc7z-CFs61-3ZQDkQ1c2jzXzIvJsbNXcrNmSAIqsM56SdqUv3V');"></div>
      <h1 class="text-lg font-bold truncate">CreatorHub</h1>
    </div>

    <!-- Navigation -->
    <nav class="flex flex-col gap-2 flex-grow">
      <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-[#ff00ff]/10 text-[#ff00ff]">
        <span class="material-symbols-outlined">dashboard</span>
        <p class="text-sm font-medium truncate">Dashboard</p>
      </a>
      <a href="{% url 'idea_list' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">lightbulb</span>
        <p class="text-sm font-medium truncate">Ideas</p>
      </a>
      <a href="{% url 'caption_page' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">title</span>
        <p class="text-sm font-medium truncate">Captions</p>
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">calendar_month</span>
        <p class="text-sm font-medium truncate">Calendar</p>
      </a>
    </nav>

    <!-- Settings & Profile -->
    <div class="mt-auto">
      <div x-data="{ open: false }" class="relative">

        <button @click="open = !open"
                class="flex items-center gap-3 px-3 py-2 w-full rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">settings</span>
          <p class="text-sm font-medium truncate">Settings</p>
        </button>

        <div x-show="open"
             @click.outside="open = false"
             x-transition.scale.left
             class="absolute top-1/2 left-full -translate-y-1/2 ml-2 w-48 bg-[#ff00ff]/10 dark:bg-[#ff00ff] rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 z-50 py-2">
          <a href="#" class="flex items-center gap-2 px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition">
            <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">person</span>
            <span class="text-sm truncate">Profile</span>
          </a>
          <a href="#" class="flex items-center gap-2 px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition">
            <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">lock</span>
            <span class="text-sm truncate">Security</span>
          </a>
          <a href="#" class="flex items-center gap-2 px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition">
            <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">notifications</span>
            <span class="text-sm truncate">Notifications</span>
          </a>
          <hr class="my-2 border-gray-200 dark:border-gray-700">
          <a href="{% url 'account_logout' %}" class="flex items-center gap-2 px-4 py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition">
            <span class="material-symbols-outlined">logout</span>
            <span class="text-sm truncate">Logout</span>
          </a>
        </div>
      </div>

      <div class="flex items-center gap-3 mt-4 p-2">
        <div class="w-10 h-10 rounded-full bg-cover" style="background-image:url('https://lh3.googleusercontent.com/aida-public/AB6AXuBD8ij-OQzPmTVLngrdioLT-GwyfSNYL1bH7WpLTVfugu2Wr-Ry-9FEsd0I53asMxdgZ2rj71OQx6RMmDak1207SlbpqaWGRzbHBvRYTa_cvWwV3SnjdDGmvx2uaZiR64zAhHf0R2LOiR2_bJj7Y4kC5reatIUiVEo6tcDOhM3J1ab4JzmIh9XoOAcRa0hVH17yHSdy52xj2nThmXIopmXNhKb3zT6K9IVg6iG1GRg1nIW66clonSSxtZdxC3KVrxVziUpixGuF3Lys');"></div>
        <div class="flex flex-col overflow-hidden">
          <p class="text-sm font-medium truncate">{{ user.email }}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 truncate">lightofor@gmail.com</p>
        </div>
      </div>
    </div>
  </aside>
</div>
