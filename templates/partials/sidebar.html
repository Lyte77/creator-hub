
<div x-data="{ sidebarOpen: false }" class="flex h-screen bg-[#0d0d0d] text-slate-200">
   <div 
  x-show="sidebarOpen"
  x-transition.opacity
  @click="sidebarOpen = false"
  class="fixed inset-0 z-30 bg-black/60 lg:hidden"
></div>
<aside
  :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
  class="fixed inset-y-0 left-0 z-40 w-64 bg-[#111111] border-r border-white/10
         transform transition-transform duration-300 ease-in-out
         lg:static lg:translate-x-0 lg:flex-shrink-0"
>
  <div class="flex h-full flex-col">
       <div class="flex items-center justify-between px-4 h-14 border-b border-white/10">
      <span class="font-semibold text-sm tracking-wide">My App</span>

      <!-- Mobile Close -->
      <button
        @click="sidebarOpen = false"
        class="lg:hidden text-slate-400 hover:text-white transition"
      >
        ✕
      </button>
    </div>
    <nav class="flex-1 overflow-y-auto px-2 py-3 space-y-1">
      <a href="" 
        hx-get="{% url 'idea_page' %}"
        hx-target="#page-content"
        hx-swap="innerHTML"
      class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm
                         hover:bg-white/5 transition">
        <span>💬</span>
        <span class="truncate">Capture Ideas</span>
      </a>

      <a href="" 
       hx-get="{% url 'idea_list' %}"
      hx-target="#page-content"
      hx-swap="innerHTML"
      class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm
                      hover:bg-white/5 transition  ">
        <span>🧠</span>
        <span class="truncate">All Ideas</span>
      </a>
      <a href="" 
       hx-get="{% url 'caption_page' %}"
      hx-target="#page-content"
      hx-swap="innerHTML"
      class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm
                    hover:bg-white/5 transition     ">
        <span>🧠</span>
        <span class="truncate">AI Caption</span>
      </a>
      <a href="" 
       hx-get="{% url 'planner_page' %}"
      hx-target="#page-content"
      hx-swap="innerHTML"
      class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm
                    hover:bg-white/5 transition     ">
        <span>🧠</span>
        <span class="truncate">Planner</span>
      </a>

      <a href="#" class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm
                         hover:bg-white/5 transition">
        <span>⚙️</span>
        <span class="truncate">Settings</span>
      </a>
    </nav>
    <div class="border-t border-white/10 p-3">
      <button class="w-full flex items-center gap-3 rounded-lg px-3 py-2 text-sm
                     hover:bg-white/5 transition">
        <span>👤</span>
        <span class="truncate">Account</span>
      </button>
    </div>
  </div>
</aside>
<div class="flex-1 flex flex-col">
  <header class="h-14 flex items-center px-4 border-b border-white/10">
    <button
      @click="sidebarOpen = true"
      class="lg:hidden text-slate-300 hover:text-white transition"
    >
      ☰
    </button>
  </header>

</div>
</div>
