<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background:#0d0d0d; font-family:Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="background:#0d0d0d; padding:40px 0;">
      <tr>
        <td align="center">
          <table width="480" cellpadding="0" cellspacing="0" style="background:#1a1a1a; border-radius:12px; padding:40px; color:#fff;">

            <!-- Logo -->
            <tr>
              <td align="center" style="padding-bottom:20px;">
                <svg height="40" width="40" fill="#ff00ff"><circle cx="20" cy="20" r="18"/></svg>
              </td>
            </tr>

            <!-- Title -->
            <tr>
              <td align="center" style="font-size:28px; font-weight:700; padding-bottom:10px;">
                Confirm Your Email
              </td>
            </tr>

            <!-- Message -->
            <tr>
              <td style="font-size:16px; line-height:1.6; color:#cccccc; text-align:center; padding-bottom:24px;">
                Hey {{ user.first_name|default:user.email }},<br>
                Welcome to <strong>CreatorHub</strong> — let's activate your account.
              </td>
            </tr>

            <!-- CTA Button -->
            <tr>
              <td align="center" style="padding-bottom:40px;">
                <a href="{{ activate_url }}" 
                   style="background:#ff00ff; color:#fff; padding:14px 28px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; display:inline-block;">
                  Verify Email
                </a>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="font-size:12px; color:#777; text-align:center;">
                If you didn’t create an account, feel free to ignore this email.
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>

  </body>
</html>
