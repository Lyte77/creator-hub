
<div id="idea-{{ idea.id }}">

<form 
  hx-post="{% url 'edit_idea' idea.id %}"
  hx-target="#idea-{{ idea.id }}"
  hx-swap="outerHTML"
  class="flex items-start justify-between p-3 rounded-lg bg-gray-50 dark:bg-[#111] border border-gray-200 dark:border-[#333] gap-2"
>
{% csrf_token %}
  <!-- Text Input -->
  <textarea 
    name="content"
    class="flex-1 bg-transparent outline-none text-sm text-gray-900 dark:text-gray-200 placeholder-gray-500 dark:placeholder-gray-400 resize-none"
    rows="2"
    required
  >{{ idea.content }}</textarea>

  <!-- Action Buttons -->
  <div class="flex flex-col items-center gap-2">

    <!-- Save -->
    <button 
      type="submit"
      class="text-primary text-xs font-semibold"
    >
      Save
    </button>

    <!-- Cancel -->
    <button 
      type="button"
      hx-get="{% url 'idea_item' idea.id %}"
      hx-target="#idea-{{ idea.id }}"
      hx-swap="outerHTML"
      class="text-gray-500 dark:text-gray-400 text-xs"
    >
      Cancel
    </button>

  </div>
</form>
</div>
