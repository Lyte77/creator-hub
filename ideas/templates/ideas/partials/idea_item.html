
<div id="no-ideas" hx-swap-oob="delete"></div>
<div
  id="idea-{{ idea.id }}"
  class="group relative mb-4 flex gap-4 rounded-xl p-5
         border border-[#ff00ff]/10 bg-[#161616]
         transition-all duration-200
         hover:border-[#ff00ff]/30 hover:bg-[#1a1a1a]
         animate-[fadeIn_0.3s_ease-out]"
>

  <!-- Idea Text -->
  <p
    class="flex-1 text-gray-300 text-lg leading-relaxed
           cursor-text break-words"
  >
    {{ idea }}
  </p>

  <!-- Actions (hidden until hover) -->
  <div
    class="flex flex-col gap-2 shrink-0
           opacity-0 group-hover:opacity-100
           transition-opacity duration-200"
  >

    <!-- Edit -->
    <button
      hx-get="{% url 'edit_idea' idea.id %}"
      hx-target="#idea-{{ idea.id }}"
      hx-swap="outerHTML"
      class="p-2 rounded-lg
             text-gray-500
             hover:text-[#ff00ff]
             hover:bg-[#ff00ff]/10
             transition-colors duration-200"
      aria-label="Edit Idea"
      title="Edit idea"
    >
      <span class="material-symbols-outlined text-base">edit</span>
    </button>

    <!-- Delete -->
    <button
      hx-delete="{% url 'delete_idea' idea.id %}"
      hx-target="#idea-{{ idea.id }}"
      hx-swap="outerHTML"
      class="p-2 rounded-lg
             text-gray-500
             hover:text-red-500
             hover:bg-red-500/10
             transition-colors duration-200"
      aria-label="Delete Idea"
      title="Delete idea"
    >
      <span class="material-symbols-outlined text-base">delete</span>
    </button>

  </div>

  <!-- Decorative Vertical Glow -->
  <div
    class="absolute left-0 top-1/4 bottom-1/4 w-[2px]
           bg-[#ff00ff] rounded-full blur-[1px]
           opacity-0 group-hover:opacity-60
           transition-opacity duration-200"
  ></div>

</div>
