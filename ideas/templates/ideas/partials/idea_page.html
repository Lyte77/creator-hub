




  <div 
  x-data="{ content: '', isFocused: false }"
  class="relative mb-16 group"
>
  <!-- Input Container -->
  <div 
    :class="isFocused 
      ? 'bg-[#141414] border-[#ff00ff]/40 shadow-[0_0_25px_rgba(255,0,255,0.05)] -translate-y-[2px]' 
      : 'bg-[#111] border-white/5 shadow-none translate-y-0'"
    class="relative transition-all duration-300 ease-out rounded-2xl border"
  >
    <!-- Top Tray -->
    <div class="flex justify-between items-center px-5 pt-3 select-none">
      <span 
        :class="isFocused ? 'text-[#ff00ff]/80' : 'text-gray-600'"
        class="text-[10px] font-bold tracking-[0.2em] uppercase transition-colors duration-300"
      >
        System Input // 01
      </span>

      <div 
        x-show="content.length > 0"
        x-transition.opacity.duration.200ms
        class="flex items-center gap-2"
      >
        <div class="w-1.5 h-1.5 rounded-full bg-[#ff00ff] animate-pulse shadow-[0_0_8px_#ff00ff]"></div>
        <span class="text-[10px] font-mono text-[#ff00ff]/60 uppercase tracking-widest">
          Capturing...
        </span>
      </div>
    </div>

    <!-- Input Area -->
    <form 
     hx-post="{% url 'add_idea' %}"
  hx-target="#recent-ideas"
  hx-swap="afterbegin"
      hx-swap="none"
     @htmx:afterRequest="
    if ($event.detail.successful) {
      content = '';
      isFocused = false;
    }
  "
    class="flex flex-col p-4 pt-1">
      <textarea
      name="content"
        x-model="content"
        @focus="isFocused = true"
        @blur="isFocused = false"
         @keydown.enter.meta.prevent="$el.form.requestSubmit()"
        rows="1"
        placeholder="What's the big idea?"
        class="w-full p-5 bg-transparent text-gray-100 text-xl md:text-2xl outline-none py-3 placeholder-gray-800 resize-none min-h-[60px] leading-relaxed"
      ></textarea>
            {% csrf_token %}
      <!-- Bottom Tray -->
      <div class="flex justify-between items-center mt-2 pt-3 border-t border-white/5">
        <div class="text-[10px] m-5 text-gray-700 font-medium">
          <span x-show="content.length > 0" x-transition>
            <span x-text="content.length" class="pr-4"></span> characters cached
          </span>
          <span x-show="content.length === 0" class="opacity-40 uppercase tracking-tighter">
            Standby for input
          </span>
        </div>

        <button
          type="submit"
          :disabled="!content.trim()"
          :class="content.trim()
            ? 'bg-[#ff00ff] text-black shadow-[0_0_15px_rgba(255,0,255,0.4)] hover:shadow-[0_0_20px_rgba(255,0,255,0.6)] hover:scale-105 active:scale-95'
            : 'bg-white/5 text-gray-700 grayscale cursor-not-allowed opacity-30'"
          class="flex items-center mr-5 gap-2 px-4 py-2 rounded-xl font-bold text-xs uppercase tracking-widest transition-all duration-300"
        >
          <span>Save</span>
          <span class="text-lg leading-none">+</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Decorative Glow -->
  <div 
    :class="isFocused ? 'opacity-100' : 'opacity-0'"
    class="absolute -inset-1 bg-[#ff00ff]/10 blur-2xl rounded-3xl -z-10 transition-opacity duration-500"
  ></div>
</div>



<div id="idea-error" class="mt-2 text-sm text-red-500"></div>


<div id="recent-ideas" class="space-y-2">
  {% for idea in recent_ideas %}
    {% include "ideas/partials/idea_item.html" %}
  {% endfor %}
   
  {% if not recent_ideas %}
    <div id="no-ideas">
      {% include "ideas/partials/no_ideas.html" %}
    </div>
  {% endif %}
</div>
