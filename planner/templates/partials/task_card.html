    <div  id="task-{{ task.id }}" class="bg-gray-900 rounded-xl p-3.5 border border-gray-800 hover:border-gray-700 transition-colors cursor-pointer">
                                <div class="flex items-start justify-between mb-3">
                                    {% if task.platform %}
                                    <span class="text-xs font-semibold px-2 py-1 rounded bg-purple-600/20 text-purple-400 uppercase tracking-wide">
                                         {{ task.get_platform_display }}
                                    </span>
                                    {% endif %}
                                    <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <rect    x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                        <polyline points="21 15 16 10 5 21"></polyline>
                                    </svg>
                                </div>
                                <h4 class="text-sm font-medium mb-3 leading-tight">{{ task.title }}</h4>
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-1.5 text-xs text-gray-500">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <polyline points="12 6 12 12 16 14"></polyline>
                                        </svg>
                                        <span>{{ day|date:"M d" }}</span>
                                    </div>
                                    <div class="w-6 h-6 bg-gray-800 rounded-full border border-gray-700"></div>
                                </div>
                            </div>
